<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Homework</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;1,400&family=Merriweather+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      min-height: 100%;
      background: #e8e8e6;
      font-family: 'Merriweather', Georgia, serif;
      color: #1a1a1a;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .card {
      background: #fff;
      border: 1px solid #c8c8c8;
      border-radius: 6px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.09);
      padding: 52px 48px 56px;
      width: 100%;
      max-width: 480px;
      text-align: center;
    }
    .eyebrow {
      font-family: 'Merriweather Sans', sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 14px;
    }
    .student-name {
      font-size: clamp(28px, 5vw, 40px);
      font-weight: 700;
      margin-bottom: 24px;
      line-height: 1.2;
    }
    .message {
      font-size: 16px;
      font-style: italic;
      color: #555;
      line-height: 1.7;
      margin-bottom: 40px;
    }
    .back-btn {
      font-family: 'Merriweather Sans', sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 10px 24px;
      border-radius: 3px;
      border: 1.5px solid #1a1a1a;
      background: transparent;
      color: #1a1a1a;
      text-decoration: none;
      transition: background 0.2s, color 0.2s;
      display: inline-block;
    }
    .back-btn:hover { background: #1a1a1a; color: #fff; }
  </style>
</head>
<body>
  <div class="card">
    <p class="eyebrow">NYC English Language Arts</p>
    <h1 class="student-name" id="name">Hello!</h1>
    <p class="message">Homework will be assigned later.</p>
    <a class="back-btn" href="index.html">&larr; Back to menu</a>
  </div>
  <script>
    const name = new URLSearchParams(location.search).get('name');
    if (name) document.getElementById('name').textContent = name;
  </script>
</body>
</html>
