<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" role="img" aria-labelledby="title desc">
  <title id="title">Simplified water-cycle model</title>
  <desc id="desc">Sunlight warms surface water. Water vapor rises, condenses into clouds, and falls as precipitation. Water then runs off or soaks into the ground; plants also release water vapor.</desc>
  <rect width="720" height="370" rx="18" fill="#edf5f7"/>
  <circle cx="108" cy="97" r="34" fill="#f2c879"/><text x="108" y="103" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#674914">sun</text>
  <path d="M0 254q125-36 245 4t245 0q100-31 230 5v107H0Z" fill="#8fb17f"/>
  <path d="M440 255q53-22 99 0t90 0q40-18 91 1v106H440Z" fill="#6fb4c9"/>
  <g fill="#fff" stroke="#cad5db" stroke-width="2"><ellipse cx="340" cy="88" rx="82" ry="29"/><ellipse cx="293" cy="96" rx="35" ry="30"/><ellipse cx="373" cy="99" rx="42" ry="27"/></g>
  <g font-family="Arial,sans-serif" font-size="15" fill="#315666"><text x="293" y="48">condensation</text><text x="520" y="204">precipitation</text><text x="464" y="330">surface water</text><text x="72" y="330">soil</text></g>
  <path d="M210 238c24-45 37-74 51-102M526 134v77M215 260c40 33 105 37 163 14M298 246c-14-32-11-67 4-101" fill="none" stroke="#397e95" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="181" y="194" font-family="Arial,sans-serif" font-size="14" fill="#315666">evaporation</text>
  <text x="265" y="226" font-family="Arial,sans-serif" font-size="13" fill="#315666">transpiration</text>
  <text x="285" y="298" font-family="Arial,sans-serif" font-size="13" fill="#315666">runoff / infiltration</text>
  <text x="25" y="356" font-family="Arial,sans-serif" font-size="12" fill="#56666b">A model: water can take many paths; this drawing is not to scale.</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 8 3 0 6" fill="none" stroke="#397e95" stroke-width="2"/></marker></defs>
</svg>
