<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel | ELA Tutoring</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;1,400&family=Merriweather+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { min-height: 100%; background: #1a1a1a; font-family: 'Merriweather Sans', sans-serif; color: #1a1a1a; }

    /* ===== LOGIN ===== */
    #login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
    .login-card { background: #fff; border-radius: 8px; padding: 48px 44px 52px; width: 100%; max-width: 380px; box-shadow: 0 8px 40px rgba(0,0,0,0.4); }
    .login-eyebrow { font-size: 10px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: #888; margin-bottom: 10px; }
    .login-card h1 { font-family: 'Merriweather', serif; font-size: 26px; font-weight: 700; margin-bottom: 6px; }
    .login-card .sub { font-size: 13px; color: #888; font-style: italic; margin-bottom: 32px; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #555; margin-bottom: 7px; }
    .field input { width: 100%; padding: 11px 14px; border: 1.5px solid #d0d0d0; border-radius: 4px; font-family: 'Merriweather Sans', sans-serif; font-size: 15px; outline: none; transition: border-color 0.15s; }
    .field input:focus { border-color: #1a1a1a; }
    .login-btn { width: 100%; padding: 13px; background: #1a1a1a; color: #fff; border: none; border-radius: 4px; font-family: 'Merriweather Sans', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; margin-top: 8px; transition: background 0.15s; }
    .login-btn:hover { background: #333; }
    .login-btn:disabled { background: #888; cursor: not-allowed; }
    .login-error { display: none; font-size: 13px; color: #c0392b; background: #fdf0ef; border: 1px solid #e74c3c; border-radius: 4px; padding: 10px 14px; margin-top: 14px; text-align: center; }
    .login-error.show { display: block; }

    /* ===== TOPBAR ===== */
    #admin-panel { display: none; min-height: 100vh; background: #f0efec; }
    .admin-topbar { background: #1a1a1a; color: #fff; padding: 0 32px; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
    .admin-topbar .brand { font-size: 13px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
    .admin-topbar .brand span { color: #888; font-weight: 400; margin-left: 10px; font-size: 11px; }
    .topbar-right { display: flex; align-items: center; gap: 16px; }
    .topbar-link { font-size: 11px; color: #aaa; text-decoration: none; letter-spacing: 0.08em; text-transform: uppercase; }
    .topbar-link:hover { color: #fff; }
    .logout-btn { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; background: transparent; border: 1px solid #555; color: #aaa; padding: 6px 14px; border-radius: 3px; cursor: pointer; }
    .logout-btn:hover { border-color: #fff; color: #fff; }

    /* ===== MAIN TABS ===== */
    .admin-body { max-width: 900px; margin: 0 auto; padding: 36px 20px 80px; }
    .main-tab-bar { display: flex; gap: 4px; margin-bottom: 28px; }
    .main-tab-btn { font-family: 'Merriweather Sans', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; padding: 11px 22px; border: 1.5px solid #c8c8c8; background: #f4f3f0; color: #666; cursor: pointer; border-radius: 4px; transition: all 0.2s; }
    .main-tab-btn.active { background: #1a1a1a; border-color: #1a1a1a; color: #fff; }
    .main-tab-content { display: none; }
    .main-tab-content.active { display: block; }

    /* ===== SHARED FORM BITS ===== */
    .form-label { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #555; margin-bottom: 7px; display: block; }
    .form-select, .form-input { width: 100%; padding: 10px 14px; border: 1.5px solid #d0d0d0; border-radius: 4px; font-family: 'Merriweather Sans', sans-serif; font-size: 14px; outline: none; background: #fff; transition: border-color 0.15s; }
    .form-select:focus, .form-input:focus { border-color: #1a1a1a; }
    .form-textarea { width: 100%; padding: 12px 14px; border: 1.5px solid #d0d0d0; border-radius: 4px; font-family: 'Merriweather Sans', sans-serif; font-size: 14px; line-height: 1.6; outline: none; background: #fff; resize: vertical; min-height: 90px; transition: border-color 0.15s; }
    .form-textarea:focus { border-color: #1a1a1a; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 18px; }
    .form-group { margin-bottom: 18px; }
    .action-btn { font-family: 'Merriweather Sans', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; padding: 11px 24px; border: none; border-radius: 4px; cursor: pointer; transition: all 0.15s; }
    .action-btn.primary { background: #1a1a1a; color: #fff; }
    .action-btn.primary:hover { background: #333; }
    .action-btn.primary:disabled { background: #888; cursor: not-allowed; }
    .action-btn.secondary { background: #fff; color: #1a1a1a; border: 1.5px solid #ccc; }
    .action-btn.secondary:hover { border-color: #1a1a1a; }
    .action-btn.success { background: #27ae60; color: #fff; }
    .action-btn.success:hover { background: #1e8449; }
    .btn-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 8px; }

    /* ===== EDITOR CARD ===== */
    .editor-card { background: #fff; border: 1px solid #d4d2cc; border-radius: 6px; padding: 28px; margin-bottom: 20px; }
    .editor-card h2 { font-family: 'Merriweather', serif; font-size: 18px; font-weight: 700; margin-bottom: 20px; padding-bottom: 14px; border-bottom: 1.5px solid #eee; }

    /* ===== PREVIEW ===== */
    .preview-box { background: #f7f6f3; border: 1px solid #dddbd4; border-radius: 4px; padding: 16px 20px; margin-top: 16px; }
    .preview-box h3 { font-size: 11px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: #888; margin-bottom: 12px; }
    .preview-content { font-family: 'Merriweather', serif; font-size: 14px; line-height: 1.8; color: #222; }
    .preview-content .preview-title { font-weight: 700; font-size: 15px; margin-bottom: 10px; }
    .preview-content .preview-sentence { margin-bottom: 8px; }
    .preview-content .preview-blank { display: inline-block; border-bottom: 2px solid #1a1a1a; min-width: 60px; font-weight: 700; color: #1a1a1a; padding: 0 4px; }
    .preview-content .word-chip { display: inline-block; background: #1a1a1a; color: #fff; border-radius: 20px; padding: 3px 14px; font-size: 12px; font-weight: 700; margin: 3px; font-family: 'Merriweather Sans', sans-serif; }
    .preview-content .math-row { font-family: 'Merriweather', serif; font-size: 16px; margin-bottom: 8px; }
    .preview-content .math-ans { display: inline-block; border: 1.5px solid #1a1a1a; border-radius: 3px; padding: 2px 10px; font-weight: 700; color: #1a1a1a; margin-left: 8px; }
    .preview-raw { font-family: monospace; font-size: 12px; color: #555; white-space: pre-wrap; word-break: break-all; margin-top: 10px; padding-top: 10px; border-top: 1px solid #e0deda; }
    .status-msg { font-size: 13px; padding: 8px 0; }
    .status-msg.ok { color: #27ae60; font-weight: 700; }
    .status-msg.err { color: #c0392b; }
    .status-msg.working { color: #888; font-style: italic; }

    /* ===== ANSWERS VIEW ===== */
    .student-card { background: #fff; border: 1px solid #d4d2cc; border-radius: 6px; margin-bottom: 20px; overflow: hidden; }
    .student-card-header { background: #1a1a1a; color: #fff; padding: 14px 22px; display: flex; align-items: center; justify-content: space-between; }
    .student-name { font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
    .student-count { font-size: 11px; color: #aaa; }
    .response-item { padding: 16px 22px; border-bottom: 1px solid #eee; }
    .response-item:last-child { border-bottom: none; }
    .response-key { font-size: 10px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: #888; margin-bottom: 6px; }
    .response-val { font-family: 'Merriweather', serif; font-size: 14px; line-height: 1.7; color: #1a1a1a; white-space: pre-wrap; }
    .response-ts { font-size: 10px; color: #bbb; margin-top: 4px; font-style: italic; }
    .no-data { padding: 24px 22px; text-align: center; font-size: 13px; color: #aaa; font-style: italic; }
    .empty-state { text-align: center; padding: 60px 20px; }
    .empty-state p { font-size: 15px; color: #aaa; font-style: italic; }
    .page-heading { font-family: 'Merriweather', serif; font-size: 22px; font-weight: 700; margin-bottom: 20px; }
    .answers-controls { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; flex-wrap: wrap; }
    .current-badge { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; background: #e8f5e9; color: #1b5e20; border: 1px solid #81c784; border-radius: 3px; padding: 3px 10px; }
    /* ===== SUMMER ANSWER KEY ===== */
    .summer-unit { background: #fff; border: 1px solid #d4d2cc; border-radius: 6px; margin-bottom: 20px; overflow: hidden; }
    .summer-unit-header { background: #1a1a1a; color: #fff; padding: 12px 20px; font-size: 13px; font-weight: 700; letter-spacing: 0.05em; }
    .summer-lesson { border-bottom: 1px solid #eee; }
    .summer-lesson:last-child { border-bottom: none; }
    .summer-lesson-header { background: #f7f6f3; padding: 10px 20px; font-size: 13px; font-weight: 700; color: #333; }
    .summer-phase-title { padding: 8px 20px; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #666; background: #fafafa; border-top: 1px solid #eee; }
    .summer-qa-row { display: grid; grid-template-columns: 46px 1fr 200px; gap: 12px; padding: 10px 20px; border-top: 1px solid #eee; align-items: start; }
    .summer-qa-row:nth-child(even) { background: #fdfdfc; }
    .summer-q-num { font-weight: 700; color: #1a1a1a; }
    .summer-q-text { font-family: 'Merriweather', serif; font-size: 13px; line-height: 1.6; color: #222; }
    .summer-q-ans { font-family: 'Merriweather Sans', sans-serif; font-size: 12px; font-weight: 700; color: #27ae60; background: #f0fff4; border: 1px solid #b7eb8f; border-radius: 4px; padding: 6px 10px; }
    .summer-qa-row.practice-row { grid-template-columns: 46px 1fr; }
    .summer-practice-ans { font-family: 'Merriweather Sans', sans-serif; font-size: 12px; color: #555; margin-top: 4px; }
    .summer-q-code { font-family: 'Merriweather Sans', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: #fff; background: #7c3aed; border-radius: 4px; padding: 3px 7px; white-space: nowrap; }
    .summer-qa-row.highlight { background: #fffbeb !important; outline: 2px solid #f59e0b; border-radius: 4px; }
    @media (max-width: 700px) { .summer-qa-row { grid-template-columns: 36px 1fr; } .summer-q-ans { margin-top: 6px; } }
    @media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<!-- ===== LOGIN SCREEN ===== -->
<div id="login-screen">
  <div class="login-card">
    <p class="login-eyebrow">NYC ELA Tutoring</p>
    <h1>Admin Panel</h1>
    <p class="sub">Sign in to manage homework &amp; view student work</p>
    <form id="login-form" autocomplete="off">
      <div class="field">
        <label for="uname">Username</label>
        <input type="text" id="uname" autocomplete="username" spellcheck="false" />
      </div>
      <div class="field">
        <label for="pword">Password</label>
        <input type="password" id="pword" autocomplete="current-password" />
      </div>
      <button type="submit" class="login-btn" id="login-btn">Sign In</button>
      <div class="login-error" id="login-error">Incorrect username or password.</div>
    </form>
  </div>
</div>

<!-- ===== ADMIN PANEL ===== -->
<div id="admin-panel">
  <div class="admin-topbar">
    <div class="brand">Admin Panel <span>NYC ELA Tutoring</span></div>
    <div class="topbar-right">
      <a href="index.html" class="topbar-link">← Student Menu</a>
      <button class="logout-btn" id="logout-btn">Log Out</button>
    </div>
  </div>

  <div class="admin-body">
    <div class="main-tab-bar">
      <button class="main-tab-btn active" data-tab="editor">Homework Editor</button>
      <button class="main-tab-btn" data-tab="answers">Student Answers</button>
      <button class="main-tab-btn" data-tab="summer-answers">Summer Answer Key</button>
    </div>

    <!-- ===== HOMEWORK EDITOR TAB ===== -->
    <div class="main-tab-content active" id="tab-editor">
      <div class="editor-card">
        <h2>Edit Homework</h2>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="sel-student">Student</label>
            <select class="form-select" id="sel-student">
              <option value="">— choose a student —</option>
              <option value="nabila-naviha">Nabila &amp; Naviha (Grade 1)</option>
              <option value="salma-khadija">Salma &amp; Khadija (Grade 5)</option>
              <option value="adnan">Adnan (Grade 4)</option>
              <option value="nafis">Nafis (Grade 4)</option>
              <option value="nahid">Nahid (Grade 5)</option>
              <option value="sameer">Sameer (Grade 9)</option>
              <option value="manha">Manha (Grade 3)</option>
              <option value="mahiya">Mahiya (Grade 1)</option>
              <option value="taha">Taha (Grade 2)</option>
              <option value="ayan">Ayan (Grade 6)</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="sel-section">Section to Edit</label>
            <select class="form-select" id="sel-section">
              <option value="fillBlank">Fill in the Blank (Assigned)</option>
              <option value="stories">Reading Stories (Assigned)</option>
              <option value="math-assigned">Assigned Math</option>
              <option value="math">Math Practice</option>
              <option value="ela">ELA Practice</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="instruction">Instruction to AI</label>
          <textarea class="form-textarea" id="instruction" rows="3"
            placeholder="e.g. Replace fill-in-the-blanks with 10 sentences about animals and nature. Use simple Grade 1 words."></textarea>
        </div>

        <div class="btn-row">
          <button class="action-btn primary" id="generate-btn">Generate with AI</button>
          <button class="action-btn secondary" id="load-current-btn">Load Current Homework</button>
          <button class="action-btn secondary" id="clear-hw-btn" style="border-color:#c0392b;color:#c0392b;" title="Wipes KV data so the page shows its built-in static content">Clear KV / Reset to Static</button>
          <span class="status-msg" id="gen-status"></span>
        </div>
      </div>

      <!-- Preview card (hidden until generated) -->
      <div class="editor-card" id="preview-card" style="display:none">
        <h2>Preview &amp; Save</h2>
        <div class="preview-box">
          <h3>Generated Content</h3>
          <div class="preview-content" id="preview-rendered"></div>
          <div class="preview-raw" id="preview-raw" style="display:none"></div>
        </div>
        <div class="btn-row" style="margin-top:16px">
          <button class="action-btn success" id="save-btn">Save &amp; Go Live</button>
          <button class="action-btn secondary" id="toggle-raw-btn">Show Raw JSON</button>
          <span class="status-msg" id="save-status"></span>
        </div>
      </div>

      <!-- Current homework display -->
      <div class="editor-card" id="current-card" style="display:none">
        <h2>Current Homework <span id="current-student-label" class="current-badge"></span></h2>
        <div class="preview-box">
          <div class="preview-raw" id="current-raw" style="display:block"></div>
        </div>
      </div>
    </div>

    <!-- ===== SUMMER ANSWER KEY TAB ===== -->
    <div class="main-tab-content" id="tab-summer-answers">
      <h1 class="page-heading">Summer Answer Key</h1>
      <div class="editor-card">
        <div class="form-row" style="grid-template-columns: 1fr auto auto; align-items: end;">
          <div class="form-group">
            <label class="form-label" for="summer-site-sel">Summer Site</label>
            <select class="form-select" id="summer-site-sel">
              <option value="">— choose a summer site —</option>
              <option value="salma-khadija-summer">Salma &amp; Khadija (Grade 7)</option>
              <option value="taha-summer">Taha (Grade 5→6 Math)</option>
              <option value="nahid-summer">Nahid (Grade 4 Math + English)</option>
              <option value="ayan-summer">Ayan (Grade 6 Science · Math · English · Social Studies)</option>
            </select>
          </div>
          <button class="action-btn primary" id="load-summer-answers-btn">Load Answers</button>
          <button class="action-btn secondary" id="print-summer-answers-btn">Print</button>
        </div>
        <div class="form-row" style="grid-template-columns: 1fr auto; align-items: end; margin-top: 12px;">
          <div class="form-group" style="margin-bottom: 0;">
            <label class="form-label" for="summer-code-search">Search by Question Code</label>
            <input class="form-input" id="summer-code-search" type="text" placeholder="e.g. U01-L01-Q05" />
          </div>
          <button class="action-btn primary" id="find-summer-code-btn">Find</button>
        </div>
        <span class="status-msg" id="summer-answers-status"></span>
      </div>
      <div id="summer-answers-view"></div>
    </div>

    <!-- ===== STUDENT ANSWERS TAB ===== -->
    <div class="main-tab-content" id="tab-answers">
      <h1 class="page-heading">Student Answers</h1>
      <div class="answers-controls">
        <select class="form-select" id="answers-student-sel" style="max-width:260px">
          <option value="">— all students —</option>
          <option value="nabila-naviha">Nabila &amp; Naviha</option>
          <option value="salma-khadija">Salma &amp; Khadija</option>
          <option value="adnan">Adnan</option>
          <option value="nafis">Nafis</option>
          <option value="nahid">Nahid</option>
          <option value="sameer">Sameer</option>
          <option value="manha">Manha</option>
          <option value="mahiya">Mahiya</option>
          <option value="taha">Taha</option>
          <option value="ayan">Ayan</option>
        </select>
        <button class="action-btn secondary" id="refresh-answers-btn">Refresh</button>
        <span class="status-msg" id="answers-status"></span>
      </div>
      <div id="answers-view"></div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var TOKEN_KEY = 'admin-token-v2';
  var token = sessionStorage.getItem(TOKEN_KEY) || '';
  var generatedResult = null; // { section, generated }
  var currentContent = {};    // full homework object for selected student

  var STUDENT_NAMES = {
    'nabila-naviha': 'Nabila & Naviha',
    'salma-khadija': 'Salma & Khadija',
    'adnan': 'Adnan',
    'nafis': 'Nafis',
    'nahid': 'Nahid',
    'sameer': 'Sameer',
    'manha': 'Manha',
    'mahiya': 'Mahiya',
    'taha': 'Taha',
    'ayan': 'Ayan'
  };

  var SUMMER_SITES = {
    'salma-khadija-summer': 'Salma & Khadija — Summer Bridge to Grade 7',
    'taha-summer': 'Taha — Summer Math Bridge Grade 5→6',
    'nahid-summer': 'Nahid — Summer Bridge to Grade 4',
    'ayan-summer': 'Ayan — Summer Bridge to Grade 6'
  };

  var KEY_LABELS = {
    'ws1-summary': 'Story 1 — Tell Your Teacher',
    'ws2-summary': 'Story 2 — Tell Your Teacher',
    'ws3-summary': 'Story 3 — Tell Your Teacher',
    'ws4-summary': 'Story 4 — Tell Your Teacher',
    'ws5-summary': 'Story 5 — Tell Your Teacher',
    'ws6-summary': 'Story 6 — Tell Your Teacher',
    'ela-story':   'ELA Practice — Tell Your Teacher',
    'ws1-arg':     'Worksheet 1 — Main Argument',
    'ws1-detail':  'Worksheet 1 — Supporting Detail',
    'ws2-arg':     'Worksheet 2 — Main Argument',
    'ws2-detail':  'Worksheet 2 — Supporting Detail',
    'ela1-ci':     'ELA — Central Idea / Claim',
    'ela1-detail': 'ELA — Evidence / Detail',
    'ela1-conn':   'ELA — Written Response'
  };

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function formatKey(k) {
    return KEY_LABELS[k] || k.replace(/[-_]/g,' ').replace(/\b\w/g, function(c){return c.toUpperCase();});
  }
  function setStatus(id, msg, cls) {
    var el = document.getElementById(id);
    if (!el) return;
    el.textContent = msg;
    el.className = 'status-msg' + (cls ? ' ' + cls : '');
  }

  // ---- AUTH ----
  function showPanel() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('admin-panel').style.display = 'block';
  }

  document.getElementById('login-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var u = document.getElementById('uname').value.trim();
    var p = document.getElementById('pword').value;
    var btn = document.getElementById('login-btn');
    btn.disabled = true;
    btn.textContent = 'Signing in…';
    fetch('/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p })
    })
    .then(function(r){ return r.json(); })
    .then(function(d) {
      btn.disabled = false;
      btn.textContent = 'Sign In';
      if (d.ok && d.token) {
        token = d.token;
        sessionStorage.setItem(TOKEN_KEY, token);
        document.getElementById('login-error').classList.remove('show');
        showPanel();
      } else {
        document.getElementById('login-error').textContent = d.error || 'Incorrect username or password.';
        document.getElementById('login-error').classList.add('show');
        document.getElementById('pword').value = '';
        document.getElementById('pword').focus();
      }
    })
    .catch(function() {
      btn.disabled = false;
      btn.textContent = 'Sign In';
      document.getElementById('login-error').textContent = 'Server error — try again.';
      document.getElementById('login-error').classList.add('show');
    });
  });

  document.getElementById('logout-btn').addEventListener('click', function () {
    token = '';
    sessionStorage.removeItem(TOKEN_KEY);
    location.reload();
  });

  // ---- MAIN TAB SWITCH ----
  document.querySelectorAll('.main-tab-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.main-tab-btn').forEach(function(b){ b.classList.remove('active'); });
      document.querySelectorAll('.main-tab-content').forEach(function(c){ c.classList.remove('active'); });
      btn.classList.add('active');
      var tab = document.getElementById('tab-' + btn.dataset.tab);
      if (tab) { tab.classList.add('active'); }
      if (btn.dataset.tab === 'answers') loadAnswersView();
      if (btn.dataset.tab === 'summer-answers') document.getElementById('summer-site-sel').focus();
    });
  });

  // ---- HOMEWORK EDITOR ----
  document.getElementById('load-current-btn').addEventListener('click', function () {
    var student = document.getElementById('sel-student').value;
    if (!student) { alert('Please choose a student first.'); return; }
    setStatus('gen-status', 'Loading…', 'working');
    fetch('/api/homework/' + student)
    .then(function(r){ return r.json(); })
    .then(function(d) {
      currentContent = d.content || {};
      setStatus('gen-status', d.content ? 'Loaded.' : 'No server homework yet (using hardcoded page).', 'ok');
      var card = document.getElementById('current-card');
      document.getElementById('current-student-label').textContent = STUDENT_NAMES[student] || student;
      document.getElementById('current-raw').textContent = JSON.stringify(currentContent, null, 2);
      card.style.display = 'block';
    })
    .catch(function() { setStatus('gen-status', 'Failed to load.', 'err'); });
  });

  document.getElementById('clear-hw-btn').addEventListener('click', function () {
    var student = document.getElementById('sel-student').value;
    if (!student) { alert('Please choose a student first.'); return; }
    if (!confirm('Clear all KV homework data for ' + (STUDENT_NAMES[student] || student) + '? The page will fall back to its built-in static content.')) return;
    setStatus('gen-status', 'Clearing…', 'working');
    fetch('/api/homework/' + student, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({})
    })
    .then(function(r){ return r.json(); })
    .then(function(d) {
      if (d.ok) {
        currentContent = {};
        setStatus('gen-status', 'Cleared! ' + (STUDENT_NAMES[student] || student) + ' now shows static HTML — tell them to refresh.', 'ok');
        document.getElementById('current-card').style.display = 'none';
      } else {
        setStatus('gen-status', 'Clear failed: ' + (d.error || 'unknown'), 'err');
      }
    })
    .catch(function(err) { setStatus('gen-status', 'Request failed: ' + err.message, 'err'); });
  });

  document.getElementById('generate-btn').addEventListener('click', function () {
    var student = document.getElementById('sel-student').value;
    var section = document.getElementById('sel-section').value;
    var instruction = document.getElementById('instruction').value.trim();
    if (!student) { alert('Please choose a student.'); return; }
    if (!instruction) { alert('Please type an instruction for the AI.'); return; }

    // Map section selector value to API section + grade from student config
    var apiSection = section === 'math-assigned' ? 'math' : section;
    var gradeMap = {
      'nabila-naviha': 1, 'mahiya': 1, 'taha': 2, 'manha': 3,
      'adnan': 4, 'nafis': 4, 'nahid': 5, 'salma-khadija': 5, 'sameer': 9
    };
    var grade = gradeMap[student] || '?';

    // Get current content for this section as context
    var current = null;
    if (section === 'fillBlank') current = (currentContent.assigned || {}).fillBlank || null;
    else if (section === 'stories') current = (currentContent.assigned || {}).stories || null;
    else if (section === 'math-assigned') current = (currentContent.assigned || {}).math || null;
    else if (section === 'math') current = currentContent.math || null;
    else if (section === 'ela') current = currentContent.ela || null;

    var btn = document.getElementById('generate-btn');
    btn.disabled = true;
    setStatus('gen-status', 'Generating with Kimi K2.6…', 'working');
    document.getElementById('preview-card').style.display = 'none';

    fetch('/api/admin/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ instruction: instruction, section: apiSection, current: current, grade: grade })
    })
    .then(function(r){ return r.json(); })
    .then(function(d) {
      btn.disabled = false;
      if (d.ok && d.generated) {
        generatedResult = { section: section, generated: d.generated };
        setStatus('gen-status', 'Generated! Review below, then click Save.', 'ok');
        showPreview(apiSection, d.generated);
      } else {
        var detail = d.detail ? ' Detail: ' + JSON.stringify(d.detail).slice(0, 300) : '';
        setStatus('gen-status', 'AI error: ' + (d.error || 'unknown') + detail, 'err');
        if (d.raw) console.error('AI raw output:', d.raw);
        console.error('Full AI error:', d);
      }
    })
    .catch(function(err) {
      btn.disabled = false;
      setStatus('gen-status', 'Request failed: ' + err.message, 'err');
    });
  });

  function showPreview(section, data) {
    var html = '';
    if (section === 'fillBlank') {
      html += '<div class="preview-title">' + esc(data.title || 'Fill in the Blank') + '</div>';
      if (data.wordBank) {
        html += '<div style="margin-bottom:12px">';
        data.wordBank.forEach(function(w){ html += '<span class="word-chip">' + esc(w) + '</span>'; });
        html += '</div>';
      }
      if (data.sentences) {
        data.sentences.forEach(function(s, i) {
          html += '<p class="preview-sentence">' + (i+1) + '. ' + esc(s.before) +
            '<span class="preview-blank">' + esc(s.answer) + '</span>' + esc(s.after) + '</p>';
        });
      }
    } else if (section === 'math') {
      html += '<div class="preview-title">' + esc(data.title || 'Math') + '</div>';
      if (data.problems) {
        data.problems.forEach(function(p, i) {
          html += '<div class="math-row">' + (i+1) + '. ' + esc(p.q) +
            ' <span class="math-ans">' + esc(p.answer) + '</span></div>';
        });
      }
    } else if (section === 'stories') {
      if (Array.isArray(data)) {
        data.forEach(function(s, i) {
          html += '<div style="margin-bottom:16px"><div class="preview-title">Story ' + (i+1) + ': ' + esc(s.title) + '</div>';
          if (s.paragraphs) s.paragraphs.forEach(function(p){ html += '<p style="margin-bottom:8px">' + esc(p) + '</p>'; });
          if (s.prompt) html += '<p style="color:#666;font-style:italic;margin-top:8px">' + esc(s.prompt) + '</p>';
          html += '</div>';
        });
      }
    } else if (section === 'ela') {
      html += '<div class="preview-title">' + esc(data.title || 'ELA Practice') + '</div>';
      if (data.paragraphs) data.paragraphs.forEach(function(p){ html += '<p style="margin-bottom:8px">' + esc(p) + '</p>'; });
      if (data.questions) {
        data.questions.forEach(function(q) {
          html += '<div style="margin-top:12px;padding-top:12px;border-top:1px solid #ddd"><strong>' + esc(q.label) + '</strong><br>' + esc(q.question) + '</div>';
        });
      }
    } else {
      html = '<pre>' + esc(JSON.stringify(data, null, 2)) + '</pre>';
    }
    document.getElementById('preview-rendered').innerHTML = html;
    document.getElementById('preview-raw').textContent = JSON.stringify(data, null, 2);
    document.getElementById('preview-card').style.display = 'block';
    document.getElementById('preview-card').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  document.getElementById('toggle-raw-btn').addEventListener('click', function () {
    var raw = document.getElementById('preview-raw');
    var btn = document.getElementById('toggle-raw-btn');
    if (raw.style.display === 'none') { raw.style.display = ''; btn.textContent = 'Hide Raw JSON'; }
    else { raw.style.display = 'none'; btn.textContent = 'Show Raw JSON'; }
  });

  document.getElementById('save-btn').addEventListener('click', function () {
    if (!generatedResult) return;
    var student = document.getElementById('sel-student').value;
    if (!student) { alert('Please choose a student.'); return; }

    var section = generatedResult.section;
    var generated = generatedResult.generated;

    // Merge generated data into the current content object at the right path
    var content = JSON.parse(JSON.stringify(currentContent));
    content.version = 1;
    content.student = student;
    if (section === 'fillBlank') {
      if (!content.assigned) content.assigned = {};
      content.assigned.fillBlank = generated;
    } else if (section === 'stories') {
      if (!content.assigned) content.assigned = {};
      content.assigned.stories = generated;
    } else if (section === 'math-assigned') {
      if (!content.assigned) content.assigned = {};
      content.assigned.math = generated;
    } else if (section === 'math') {
      content.math = generated;
    } else if (section === 'ela') {
      content.ela = generated;
    }

    var btn = document.getElementById('save-btn');
    btn.disabled = true;
    setStatus('save-status', 'Saving…', 'working');

    fetch('/api/homework/' + student, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify(content)
    })
    .then(function(r){ return r.json(); })
    .then(function(d) {
      btn.disabled = false;
      if (d.ok) {
        currentContent = d.content || content;
        setStatus('save-status', 'Saved! Live for ' + (STUDENT_NAMES[student] || student) + ' — they should refresh.', 'ok');
      } else {
        setStatus('save-status', 'Save failed: ' + (d.error || 'unknown'), 'err');
      }
    })
    .catch(function(err) {
      btn.disabled = false;
      setStatus('save-status', 'Request failed: ' + err.message, 'err');
    });
  });

  // ---- STUDENT ANSWERS ----
  function loadAnswersView() {
    var filterStudent = document.getElementById('answers-student-sel').value;
    var students = filterStudent ? [filterStudent] : Object.keys(STUDENT_NAMES);
    var view = document.getElementById('answers-view');
    view.innerHTML = '';
    setStatus('answers-status', 'Loading…', 'working');

    var fetches = students.map(function(sid) {
      return fetch('/api/answers/' + sid, {
        headers: { 'Authorization': 'Bearer ' + token }
      })
      .then(function(r){ return r.json(); })
      .then(function(d){ return { sid: sid, record: d.record }; })
      .catch(function(){ return { sid: sid, record: null }; });
    });

    Promise.all(fetches).then(function(results) {
      setStatus('answers-status', '', '');
      var anyData = false;
      var html = '';
      results.forEach(function(res) {
        var record = res.record;
        if (!record || !record.answers || !Object.keys(record.answers).length) return;
        var answers = record.answers;
        var keys = Object.keys(answers).filter(function(k) {
          return answers[k] && answers[k].length >= 5;
        });
        if (!keys.length) return;
        anyData = true;
        var ts = record.updatedAt ? new Date(record.updatedAt).toLocaleString() : '';
        html += '<div class="student-card">';
        html += '<div class="student-card-header">';
        html += '<span class="student-name">' + esc(STUDENT_NAMES[res.sid] || res.sid) + '</span>';
        html += '<span class="student-count">' + keys.length + ' response' + (keys.length !== 1 ? 's' : '') + '</span>';
        html += '</div>';
        keys.forEach(function(k) {
          html += '<div class="response-item">';
          html += '<div class="response-key">' + esc(formatKey(k)) + '</div>';
          html += '<div class="response-val">' + esc(answers[k]) + '</div>';
          if (ts) html += '<div class="response-ts">Last synced: ' + esc(ts) + '</div>';
          html += '</div>';
        });
        html += '</div>';
      });
      if (!anyData) {
        html = '<div class="empty-state"><p>No student answers on the server yet. Students need to type in their pages — answers sync automatically.</p></div>';
      }
      view.innerHTML = html;
    });
  }

  document.getElementById('refresh-answers-btn').addEventListener('click', loadAnswersView);
  document.getElementById('answers-student-sel').addEventListener('change', loadAnswersView);

  // ---- SUMMER ANSWER KEY ----
  var loadedSummerSite = null;
  function loadSummerContent(site, callback) {
    if (window.LEARNKIT && loadedSummerSite === site) { callback(window.LEARNKIT); return; }
    window.LEARNKIT = undefined;
    var script = document.createElement('script');
    script.src = 'https://zidni0.github.io/' + site + '/content.js?v=' + Date.now();
    script.onload = function () {
      var cfg = window.LEARNKIT;
      window.LEARNKIT = undefined;
      loadedSummerSite = site;
      callback(cfg);
    };
    script.onerror = function () { callback(null); };
    document.head.appendChild(script);
  }

  function renderSummerAnswers(cfg, site) {
    var html = '';
    if (!cfg || !cfg.units || !cfg.units.length) {
      html = '<div class="empty-state"><p>No content found. Check the site name and try again.</p></div>';
      document.getElementById('summer-answers-view').innerHTML = html;
      return;
    }
    html += '<div class="editor-card" style="margin-bottom:12px"><strong>' + esc(SUMMER_SITES[site] || site) + '</strong> — ' + (cfg.units.length) + ' units · ' + cfg.units.reduce(function(t, u){ return t + (u.lessons || []).length; }, 0) + ' lessons</div>';
    cfg.units.forEach(function (u, ui) {
      html += '<div class="summer-unit">';
      html += '<div class="summer-unit-header">Unit ' + (ui + 1) + ': ' + esc(u.title) + '</div>';
      (u.lessons || []).forEach(function (l, li) {
        html += '<div class="summer-lesson">';
        html += '<div class="summer-lesson-header">Lesson ' + (li + 1) + ': ' + esc(l.title) + '</div>';
        var qn = 1;
        (l.phases || []).forEach(function (ph) {
          function mcqAnswer(item) {
            if (item.options && typeof item.a === 'number' && item.a >= 0 && item.a < item.options.length) {
              return item.options[item.a];
            }
            return item.answer !== undefined ? item.answer : item.a;
          }
          if (ph.kind === 'drill' && ph.questions) {
            html += '<div class="summer-phase-title">Drill — ' + esc(ph.title) + '</div>';
            ph.questions.forEach(function (q) {
              var code = q.code || (codePrefix(ui, li) + '-Q' + pad(qn));
              html += '<div class="summer-qa-row" data-code="' + esc(code) + '">';
              html += '<span class="summer-q-num">Q' + qn + '<br><span class="summer-q-code">' + esc(code) + '</span></span>';
              html += '<span class="summer-q-text">' + esc(q.q || q.prompt || '') + '</span>';
              html += '<span class="summer-q-ans">' + esc(mcqAnswer(q)) + '</span>';
              html += '</div>';
              qn++;
            });
          } else if (ph.kind === 'activity') {
            var actStages = ph.stages || ph.phases || [];
            html += '<div class="summer-phase-title">Activity — ' + esc(ph.title) + '</div>';
            actStages.forEach(function (s) {
              var code = s.code || (codePrefix(ui, li) + '-Q' + pad(qn));
              html += '<div class="summer-qa-row" data-code="' + esc(code) + '">';
              html += '<span class="summer-q-num">Q' + qn + '<br><span class="summer-q-code">' + esc(code) + '</span></span>';
              html += '<span class="summer-q-text">' + esc(s.text || s.prompt || '') + '</span>';
              html += '<span class="summer-q-ans">' + esc(mcqAnswer(s)) + '</span>';
              html += '</div>';
              qn++;
            });
          } else if (ph.kind === 'practice') {
            var practiceHtml = '';
            if (ph.mode === 'match' && ph.pairs) {
              practiceHtml = ph.pairs.map(function (p) {
                var left = Array.isArray(p) ? p[0] : p.left;
                var right = Array.isArray(p) ? p[1] : p.right;
                return esc(left) + ' → ' + esc(right);
              }).join(' · ');
            } else if (ph.mode === 'categorize' && ph.items) {
              practiceHtml = ph.items.map(function (it) {
                var binName = it.category;
                if (binName == null && ph.bins) {
                  var key = it.bin;
                  if (typeof key === 'number') binName = ph.bins[key];
                  else binName = ph.bins[key] || key;
                }
                if (binName == null) binName = '?';
                var pcode = it.code || '';
                return (pcode ? '<span class="summer-q-code">' + esc(pcode) + '</span> ' : '') + esc(it.text) + ' → ' + esc(binName);
              }).join(' · ');
            } else if (ph.mode === 'dragSort' && ph.items) {
              practiceHtml = 'Order: ' + ph.items.slice().sort(function(a,b){ return a.order - b.order; }).map(function(it){ var pcode = it.code || ''; return (pcode ? '<span class="summer-q-code">' + esc(pcode) + '</span> ' : '') + esc(it.text); }).join(' → ');
            }
            if (practiceHtml) {
              html += '<div class="summer-phase-title">Practice — ' + esc(ph.title) + ' (' + esc(ph.mode) + ')</div>';
              html += '<div class="summer-qa-row practice-row">';
              html += '<span class="summer-q-num">—</span>';
              html += '<div><div class="summer-q-text" style="margin-bottom:4px">' + esc(ph.title) + '</div><div class="summer-practice-ans">' + practiceHtml + '</div></div>';
              html += '</div>';
            }
          }
        });
        html += '</div>'; // end lesson
      });
      html += '</div>'; // end unit
    });
    document.getElementById('summer-answers-view').innerHTML = html;
  }

  document.getElementById('load-summer-answers-btn').addEventListener('click', function () {
    var site = document.getElementById('summer-site-sel').value;
    if (!site) { alert('Please choose a summer site.'); return; }
    var btn = document.getElementById('load-summer-answers-btn');
    btn.disabled = true;
    setStatus('summer-answers-status', 'Loading…', 'working');
    loadSummerContent(site, function (cfg) {
      btn.disabled = false;
      if (!cfg) {
        setStatus('summer-answers-status', 'Failed to load content.js from ' + site, 'err');
        return;
      }
      renderSummerAnswers(cfg, site);
      setStatus('summer-answers-status', 'Loaded answer key for ' + (SUMMER_SITES[site] || site) + '.', 'ok');
    });
  });

  document.getElementById('print-summer-answers-btn').addEventListener('click', function () {
    window.print();
  });

  function pad(n) { return String(n).padStart(2, '0'); }
  function codePrefix(ui, li) { return 'U' + pad(ui + 1) + '-L' + pad(li + 1); }

  function findSummerCode() {
    var raw = document.getElementById('summer-code-search').value.trim().toUpperCase();
    if (!raw) return;
    var code = raw.replace(/\s+/g, '');
    var view = document.getElementById('summer-answers-view');
    var rows = view.querySelectorAll('.summer-qa-row[data-code]');
    var matched = null;
    rows.forEach(function (row) {
      row.classList.remove('highlight');
      var rc = (row.dataset.code || '').toUpperCase().replace(/\s+/g, '');
      if (!matched && rc === code) {
        matched = row;
        row.classList.add('highlight');
      }
    });
    if (matched) {
      matched.scrollIntoView({ behavior: 'smooth', block: 'center' });
      setStatus('summer-answers-status', 'Jumped to ' + matched.dataset.code + '.', 'ok');
    } else {
      setStatus('summer-answers-status', 'Code "' + raw + '" not found. Load the site first or check the code.', 'err');
    }
  }

  document.getElementById('find-summer-code-btn').addEventListener('click', findSummerCode);
  document.getElementById('summer-code-search').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') findSummerCode();
  });

  // ---- INIT ----
  if (token) {
    // Verify token is still valid by making a cheap request
    fetch('/api/answers/nabila-naviha', { headers: { 'Authorization': 'Bearer ' + token } })
    .then(function(r) {
      if (r.status === 401) { token = ''; sessionStorage.removeItem(TOKEN_KEY); }
      else showPanel();
    })
    .catch(function() { showPanel(); }); // network error — show panel optimistically
  }

})();
</script>
</body>
</html>
