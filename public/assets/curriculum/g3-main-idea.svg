<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc">
  <title id="title">Find a main idea using supporting details</title>
  <desc id="desc">A main-idea box connects to three evidence boxes, which help explain how the details support the idea.</desc>
  <rect width="720" height="300" rx="18" fill="#f7f4ed"/>
  <rect x="217" y="28" width="286" height="74" rx="14" fill="#d8e4eb" stroke="#34566b" stroke-width="2"/>
  <text x="360" y="61" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#203e50">MAIN IDEA</text>
  <text x="360" y="84" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#203e50">What is mostly true?</text>
  <g fill="#fff" stroke="#87969a" stroke-width="2"><rect x="30" y="151" width="190" height="82" rx="12"/><rect x="265" y="151" width="190" height="82" rx="12"/><rect x="500" y="151" width="190" height="82" rx="12"/></g>
  <g font-family="Arial,sans-serif" text-anchor="middle" fill="#38484e"><text x="125" y="184" font-size="17" font-weight="700">Detail 1</text><text x="125" y="209" font-size="14">from the text</text><text x="360" y="184" font-size="17" font-weight="700">Detail 2</text><text x="360" y="209" font-size="14">from the text</text><text x="595" y="184" font-size="17" font-weight="700">Detail 3</text><text x="595" y="209" font-size="14">from the text</text></g>
  <path d="M280 104 137 147M360 105v42M440 104l143 43" fill="none" stroke="#62777f" stroke-width="3"/>
  <text x="360" y="272" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#4a4740">Explain how at least two details support the main idea.</text>
</svg>
