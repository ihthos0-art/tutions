<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="title desc">
  <title id="title">Conceptual network showing exchange across Eurasian trade routes</title>
  <desc id="desc">A non-scale schematic connects Chang'an, Central Asian oasis cities, Baghdad, and Constantinople to show that trade used linked routes rather than one road.</desc>
  <rect width="720" height="320" rx="18" fill="#f7f4ed"/>
  <text x="32" y="42" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#27333b">Trade moved through connected places, not one single road</text>
  <path d="M111 159C207 97 234 222 323 159S437 96 514 160s77 17 100-8" fill="none" stroke="#9a7550" stroke-width="5" stroke-dasharray="10 8"/>
  <g fill="#d8e4eb" stroke="#34566b" stroke-width="3"><circle cx="110" cy="160" r="40"/><circle cx="285" cy="160" r="40"/><circle cx="460" cy="160" r="40"/><circle cx="625" cy="160" r="40"/></g>
  <g font-family="Arial,sans-serif" text-anchor="middle" fill="#203e50"><text x="110" y="155" font-size="14" font-weight="700">Chang'an</text><text x="110" y="175" font-size="11">East Asia</text><text x="285" y="155" font-size="13" font-weight="700">Oasis</text><text x="285" y="175" font-size="11">towns</text><text x="460" y="155" font-size="13" font-weight="700">Baghdad</text><text x="460" y="175" font-size="11">West Asia</text><text x="625" y="155" font-size="13" font-weight="700">Constantinople</text><text x="625" y="175" font-size="11">Europe/Asia</text></g>
  <text x="360" y="255" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#4a4740">Merchants, goods, ideas, and technologies could pass through many communities.</text>
  <text x="360" y="281" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#53636a">Conceptual schematic only — not to scale and not a precise map of historical routes.</text>
</svg>
