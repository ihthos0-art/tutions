<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="title desc">
  <title id="title">Equivalent ratios in a table</title>
  <desc id="desc">The ratio of blue to yellow beads is two to five. Scaling both quantities by two gives four to ten; scaling by one and one-half gives three to seven and one-half.</desc>
  <rect width="720" height="280" rx="18" fill="#f7f4ed"/>
  <text x="34" y="44" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#27333b">Equivalent ratios multiply both parts by the same number</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <rect x="95" y="74" width="530" height="54" rx="8" fill="#d8e4eb"/><rect x="95" y="128" width="530" height="54" fill="#fff" stroke="#d4d2cc"/><rect x="95" y="182" width="530" height="54" rx="0 0 8 8" fill="#fff" stroke="#d4d2cc"/>
    <text x="225" y="109" font-size="17" font-weight="700" fill="#203e50">Blue beads</text><text x="495" y="109" font-size="17" font-weight="700" fill="#203e50">Yellow beads</text>
    <text x="225" y="164" font-size="20" fill="#344b55">2</text><text x="495" y="164" font-size="20" fill="#344b55">5</text>
    <text x="225" y="218" font-size="20" fill="#344b55">3</text><text x="495" y="218" font-size="20" fill="#344b55">7.5</text>
  </g>
  <path d="M275 154h188M275 208h188" stroke="#8a9597" stroke-width="1" stroke-dasharray="6 7"/>
  <text x="360" y="263" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#4a4740">2:5 and 3:7.5 are equivalent because both parts scale by 1.5.</text>
</svg>
