name = "tutions"
compatibility_date = "2026-06-06"
main = "src/index.js"
account_id = "effe1cb197be20d44ef9d5ee2aea2bf9"

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/api/*"]

# KV namespace for homework content + student answers
# Run: npx wrangler kv namespace create HOMEWORK
# Then paste the returned id and preview_id below:
[[kv_namespaces]]
binding = "HOMEWORK"
id = "PASTE_PRODUCTION_ID_HERE"
preview_id = "PASTE_PREVIEW_ID_HERE"

# Secrets pushed via wrangler (never in this file):
# GROQ_API_KEY, CEREBRAS_API_KEY, MISTRAL_API_KEY, OPENROUTER_API_KEY, COHERE_API_KEY
# OLLAMA_API_KEY        ← Kimi K2.6 via Ollama Cloud (admin AI editor)
# ADMIN_USERNAME        ← admin login username
# ADMIN_PASSWORD        ← admin login password
# ADMIN_TOKEN_SECRET    ← HMAC signing key (any long random string)
