<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Poison Challenge demo | LearnFlow</title>
  <link rel="stylesheet" href="assets/css/fonts.css?v=20261119" />
  <link rel="stylesheet" href="assets/css/poison.css?v=20261119" />
</head>
<body>
  <noscript>Enable JavaScript to play the demo.</noscript>

  <header class="game-topbar">
    <a class="game-back" href="/poison">Real game →</a>
    <h1 class="game-title">Poison Challenge demo</h1>
    <span class="game-player">Test mode, no login, 3 bots</span>
  </header>

  <main class="game-main">
    <section class="screen" id="demo-placement">
      <h2>Place your 3 poisons</h2>
      <p class="screen-help">You and 3 bots. Pick three cells. The bots pick theirs instantly.</p>
      <p class="screen-help" id="demo-count">0 / 3 chosen</p>
      <div class="board" id="demo-place-board"></div>
      <button type="button" class="btn" id="demo-place-submit" disabled>Start the game</button>
    </section>

    <section class="screen" id="demo-play" hidden>
      <div class="turn-banner" id="demo-banner"></div>
      <div class="board-wrap">
        <div class="board" id="demo-play-board"></div>
        <div class="board-lock" id="demo-lock" hidden>Not your turn</div>
      </div>
      <ul class="lives-list" id="demo-lives"></ul>
    </section>

    <section class="screen" id="demo-finished" hidden>
      <h2>Game over</h2>
      <p class="screen-help" id="demo-winner"></p>
      <ol class="leaderboard" id="demo-leaderboard"></ol>
      <button type="button" class="btn" id="demo-restart">Play again</button>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="assets/js/poison-demo.js?v=20261119"></script>
</body>
</html>
