<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Amazing Cats · Grade 4 science workbook</title>
  <style>
    body { margin: 0; background: #14101f; color: #f4f0ff; font-family: system-ui, sans-serif; }
    header { position: sticky; top: 0; z-index: 2; display: flex; gap: 12px; align-items: center; padding: 12px 16px; background: #1d1730; border-bottom: 1px solid #3a2c5e; }
    header a { color: #ffd166; text-decoration: none; font-weight: 700; font-size: 14px; }
    header h1 { margin: 0; font-size: 16px; font-weight: 700; }
    main { max-width: 900px; margin: 0 auto; padding: 14px; display: grid; gap: 14px; }
    figure { margin: 0; background: #221a38; border: 1px solid #3a2c5e; border-radius: 12px; padding: 8px; }
    figure img { display: block; width: 100%; height: auto; border-radius: 8px; background: #fff; }
    figcaption { padding: 6px 4px 2px; font-size: 12px; color: #b9a9e6; }
    .print { text-align: center; padding: 10px 0 30px; font-size: 13px; }
    .print a { color: #ffd166; }
  </style>
</head>
<body>
  <header>
    <a href="/manha">Back</a>
    <h1>Amazing Cats · Grade 4 science</h1>
  </header>
  <main id="pages"></main>
  <p class="print">Need to print or scribble on it? <a href="/homework/manha/hw-grade-4.pdf">Open the PDF file</a></p>
  <script>
    var host = document.getElementById('pages');
    for (var i = 1; i <= 8; i += 1) {
      var fig = document.createElement('figure');
      var img = document.createElement('img');
      img.loading = i <= 2 ? 'eager' : 'lazy';
      img.src = 'page-' + i + '.jpg';
      img.alt = 'Amazing Cats workbook page ' + i;
      var cap = document.createElement('figcaption');
      cap.textContent = 'Page ' + i + ' of 8';
      fig.append(img, cap);
      host.appendChild(fig);
    }
  </script>
</body>
</html>
